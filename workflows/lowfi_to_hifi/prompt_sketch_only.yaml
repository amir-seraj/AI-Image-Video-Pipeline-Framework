prompt_template: |
  You are given a rough hand-drawn sketch of a shoe design. Study every line,
  strap, opening, cutout, and structural element carefully. Reproduce the sketch
  faithfully — if the sketch shows an open toe, the output must have an open toe.
  If it shows a closed toe, keep it closed. Do not add, remove, or alter any
  structural element. Any text or annotations in the sketch are notes for the
  designer — ignore them entirely and do not reproduce them in the output.

  Here is a detailed analysis of the sketch's design elements — use this as a
  checklist to ensure every feature is correctly represented in your output:

  $features

  Generate a high-fidelity professional pencil sketch of a single shoe that
  faithfully renders the design.

  Output style: clean black-and-white pencil rendering on off-white paper,
  professional fashion sketch quality, single shoe, fine line work with shading
  for depth. No text, no labels, no annotations — only the shoe drawing.
  $extra_specs

default_params:
  temperature: 0.8

negative_prompt: ""
