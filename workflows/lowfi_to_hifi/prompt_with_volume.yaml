prompt_template: |
  You are given two images: a 3D volume showing the shoe's shape and proportions,
  and a rough hand-drawn sketch showing the design. Study the volume to understand
  the depth, curves, and structure. Study the sketch to understand every design
  detail — lines, straps, openings, cutouts, and structural elements. Reproduce
  the sketch faithfully — if the sketch shows an open toe, the output must have an
  open toe. If it shows a closed toe, keep it closed. Do not add, remove, or alter
  any structural element. Any text or annotations in the sketch are notes for the
  designer — ignore them entirely and do not reproduce them in the output.

  Generate a high-fidelity professional pencil sketch of a single shoe that
  combines the 3D understanding from the volume with the design from the sketch.

  Output style: clean black-and-white pencil rendering on off-white paper,
  professional fashion sketch quality, single shoe, fine line work with shading
  for depth. No text, no labels, no annotations — only the shoe drawing.
  $extra_specs

default_params:
  temperature: 0.8

negative_prompt: ""
